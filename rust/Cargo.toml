[package]
name = "mosdns-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Rust port of mosdns v5, preserving its plugin and sequence model"

[features]
default = ["full"]
full = [
    "dep:base64", "dep:flate2", "dep:h3", "dep:h3-quinn",
    "hickory-proto/text-parsing", "dep:http-body-util", "dep:hyper",
    "dep:hyper-util", "dep:prost", "dep:reqwest", "dep:quinn",
    "dep:rustls", "dep:rustls-pemfile", "dep:rustls-native-certs",
    "dep:tokio-rustls", "dep:toml", "dep:windows-service",
]
minimal = []

[dependencies]
anyhow = "1"
base64 = { version = "0.22", optional = true }
bytes = "1"
futures = "0.3"
flate2 = { version = "1", optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
hickory-proto = { version = "0.24" }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"], optional = true }
ipnet = "2"
libc = "0.2"
lru = "0.12"
rand = "0.8"
prost = { version = "0.13", optional = true }
regex = "1"
# Upstream supplies the shared system-root rustls config with use_preconfigured_tls.
# Avoid linking a second, unused Mozilla root bundle into the executable.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "http2"], optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls-native-certs = { version = "0.8.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "parking_lot", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
toml = { version = "0.8", optional = true }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-service = { version = "0.8.1", optional = true }
